plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'combat-tracker'
}

// The file is named for the Minecraft version it targets, e.g.
// combat-tracker-1.21.11.jar, because a release publishes one jar per Minecraft
// version and that is the only thing a person downloading one needs in order to
// pick the right file. The mod's own version stays in `version` above, so
// fabric.mod.json — which is what the launcher, Mod Menu and Modrinth actually
// read for update checks — still reports it correctly.
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = project.minecraft_version
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"combat_tracker" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// ── Alert endpoint ───────────────────────────────────────────────────────────
// Baked into the jar at build time from a Gradle property, so the URL never has to
// live in a tracked file. Set it in ~/.gradle/gradle.properties (outside this repo):
//
//     combatTrackerAlertEndpoint=https://...
//
// Left unset — on a fresh clone, on CI — this writes an empty file and the mod
// reports nowhere, which is the correct default for a public repository. Note the
// endpoint is still readable inside any jar built with it set; keeping it out of git
// protects the repository and its history, not the artifact. See WebhookNotifier.
def alertEndpointFile = layout.buildDirectory.file('generated/alerts/combat_tracker/alert-endpoint.txt')

tasks.register('generateAlertEndpoint') {
	def endpoint = (project.findProperty('combatTrackerAlertEndpoint') ?: '').toString().trim()
	inputs.property 'endpoint', endpoint
	outputs.file alertEndpointFile
	doLast {
		def f = alertEndpointFile.get().asFile
		f.parentFile.mkdirs()
		f.text = endpoint
		logger.lifecycle(endpoint.isEmpty()
				? 'Combat Tracker: no alert endpoint set, reporting disabled in this build'
				: 'Combat Tracker: alert endpoint baked in (' + endpoint.length() + ' chars)')
	}
}

sourceSets.client.resources.srcDir(layout.buildDirectory.dir('generated/alerts'))
// Every task that reads the client resource tree needs the generator to have run —
// sourcesJar consumes it too, and Gradle rejects the implicit dependency.
tasks.matching { it.name in ['processClientResources', 'sourcesJar', 'clientSourcesJar'] }
		.configureEach { dependsOn 'generateAlertEndpoint' }

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu - provides the in-game config screen entry.
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Cloth Config: builds the actual settings screen (sliders, dropdowns, toggles).
	// Exclude its bundled Fabric API so it doesn't clash with the version above.
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	def version = project.version
	// Pinned exactly, not to a range. A build compiled against one Minecraft version
	// binds mixins to that version's method signatures, and those move within 1.21.x
	// — the input handlers changed shape at 1.21.9 and the hotbar slot accessors at
	// 1.21.5. A jar that loads on a version it was not built for fails at mixin
	// application, which is a crash on startup rather than a missing feature, so the
	// dependency has to be as narrow as the build actually is.
	def mcVersion = project.minecraft_version
	inputs.property "version", version
	inputs.property "minecraft_version", mcVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": mcVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// Renders a synthetic session report + share link without launching the game.
// Everything downstream of SessionData is deliberately Minecraft-free so this works.
tasks.register('reportPreview', JavaExec) {
	group = 'verification'
	description = 'Render a synthetic session report and share link to build/preview'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'combat_tracker.record.ReportPreview'
	args = [project.findProperty('previewOut') ?: 'build/preview',
			project.findProperty('previewEvents') ?: '120',
			project.findProperty('previewRecordings') ?: '']
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Rebuilds share links from saved HTML reports, titled by file name.
tasks.register('linkifyReports', JavaExec) {
	group = 'verification'
	description = 'Turn a folder of saved HTML reports into titled share links'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'combat_tracker.record.LinkifyReports'
	args = [project.findProperty('linkifyDir') ?: '',
			project.findProperty('linkifyBase') ?: '']
}
