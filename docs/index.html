<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat Tracker Session</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c2026; --panel-2:#161a20; --line:#2a2f37; --line-hi:#3d4550;
    --text:#e8eaed; --muted:#8a93a0; --dim:#5f6772; --accent:#9fb3c8; --warn:#ffb454;
    --ease:cubic-bezier(.22,.61,.36,1); --fast:140ms; --med:220ms;
    --e1:0 1px 3px rgba(0,0,0,.30); --e2:0 6px 18px rgba(0,0,0,.38);
  }
  *{box-sizing:border-box;}
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);
       margin:0;padding:clamp(16px,2.5vw,32px);-webkit-font-smoothing:antialiased;}
  h1{font-size:clamp(19px,1.4vw + 14px,26px);margin:0 0 4px;letter-spacing:-.01em;}
  h2{font-size:clamp(14px,.5vw + 12px,17px);margin:28px 0 8px;color:var(--accent);letter-spacing:.01em;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:12px;line-height:1.55;}
  .who{display:flex;align-items:center;gap:14px;margin:14px 0 4px;flex-wrap:wrap;}
  .who img{width:52px;height:52px;image-rendering:pixelated;border-radius:8px;background:var(--panel);
           box-shadow:var(--e1);transition:transform var(--med) var(--ease);}
  .who img:hover{transform:scale(1.06);}
  .who .ign{font-size:clamp(20px,1vw + 16px,25px);font-weight:600;letter-spacing:-.01em;}
  .vs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap;}
  .vs img{width:24px;height:24px;image-rendering:pixelated;border-radius:5px;background:var(--panel);}
  table{border-collapse:collapse;font-size:13px;margin:4px 0;}
  td,th{border:1px solid var(--line);padding:5px 11px;text-align:left;}
  th{background:var(--panel);color:var(--accent);font-weight:600;}
  tr{transition:background var(--fast) var(--ease);} tr:hover td{background:#191d24;}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 17px;
        min-width:112px;box-shadow:var(--e1);
        transition:transform var(--med) var(--ease),border-color var(--med) var(--ease),
                   box-shadow var(--med) var(--ease);}
  .card:hover{transform:translateY(-2px);border-color:var(--line-hi);box-shadow:var(--e2);}
  .card .v{font-size:clamp(19px,1vw + 15px,23px);font-weight:600;letter-spacing:-.01em;}
  .card .k{font-size:12px;color:var(--muted);margin-top:1px;}
  .note{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px;
        font-size:12px;line-height:1.6;color:var(--accent);}
  .warn{color:var(--warn);}
  .thin{color:var(--warn);font-size:12px;margin:4px 0 8px;}
  svg.chart circle{cursor:pointer;transition:r var(--fast) var(--ease),stroke-width var(--fast) var(--ease);}
  svg.chart circle:hover{stroke:#fff;stroke-width:1.5;r:4.5;}
  svg.chart circle[data-sel]{stroke:#fff;stroke-width:2.5;r:5;}
  svg.chart{box-shadow:var(--e1);transition:border-color var(--med) var(--ease),box-shadow var(--med) var(--ease);}
  .chartwrap{margin-bottom:16px;}
  .chartwrap:hover svg.chart{border-color:var(--line-hi);box-shadow:var(--e2);}
  .readout{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim);
           padding:7px 2px 0;min-height:18px;transition:color var(--med) var(--ease);}
  .readout.on{color:var(--text);animation:ctIn var(--med) var(--ease);}
  @keyframes ctIn{from{opacity:0;transform:translateY(3px);} to{opacity:1;transform:none;}}
  .reveal{opacity:0;transform:translateY(14px);
          transition:opacity 460ms var(--ease),transform 460ms var(--ease);}
  .reveal.shown{opacity:1;transform:none;}
  #empty{max-width:640px;line-height:1.7;}
  a{color:#29b6f6;text-decoration:none;border-bottom:1px solid transparent;
    transition:border-color var(--fast) var(--ease);}
  a:hover{border-bottom-color:#29b6f6;}
  code{background:#0f1114;padding:2px 6px;border-radius:5px;font-size:12px;border:1px solid var(--line);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
    .reveal{opacity:1;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const HIT = '#4caf50', MISS = '#ef5350', COMBO = '#29b6f6', ACCENT = '#ffb454';
const VANILLA_REACH = 3.0, HB_W = 0.3, HB_H = 0.9;

// ── Binary reader ──────────────────────────────────────────────────────────
// Mirrors SharePayload's writer exactly. Bit operators are avoided for the wide
// values: JavaScript's are 32-bit, and an epoch timestamp needs 41.
class Reader {
  constructor(bytes) { this.b = bytes; this.p = 0; }
  u8()      { return this.b[this.p++]; }
  varLong() {
    let result = 0, shift = 0, byte;
    do { byte = this.b[this.p++]; result += (byte & 0x7f) * Math.pow(2, shift); shift += 7; }
    while (byte & 0x80);
    return result;
  }
  zig()  { const n = this.varLong(); return (n % 2 === 0) ? n / 2 : -(n + 1) / 2; }
  cent() { return this.zig() / 100; }
  str()  {
    const len = this.varLong();
    const slice = this.b.subarray(this.p, this.p + len);
    this.p += len;
    return new TextDecoder().decode(slice);
  }
}

function b64urlToBytes(s) {
  const pad = s.length % 4 === 0 ? '' : '='.repeat(4 - (s.length % 4));
  const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/') + pad);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function decode(raw) {
  const r = new Reader(raw);
  const version = r.u8();
  if (version < 1 || version > 4) {
    throw new Error('This link uses format version ' + version + ', which this page cannot read yet.');
  }

  const d = { version };
  d.player = r.str();
  d.playerUuid = r.str();
  // v3 carries a label for the session; older links simply have none.
  d.title = version >= 3 ? (r.str() || null) : null;
  d.startEpochMs = r.varLong();
  d.durationMs = r.varLong();
  d.endEpochMs = d.startEpochMs + d.durationMs;

  const oc = r.varLong();
  d.opponents = [];
  for (let i = 0; i < oc; i++) d.opponents.push(r.str());

  d.jumpAttempts = r.varLong(); d.jumpHits = r.varLong();
  d.jumpAvgMs = r.cent();       d.jumpSdMs = r.cent();
  if (version >= 2) {
    d.pingMs = r.varLong();
    r.cent(); r.cent();   // hitAvgMs / hitSdMs, retained in the format
    r.zig();  r.zig();    // hitMinMs / hitMaxMs
  }
  d.combos = r.varLong();       d.comboIntervals = r.varLong();
  d.comboAvgMs = r.cent();      d.comboJitterMs = r.cent();
  d.swings = r.varLong();       d.swingHits = r.varLong();
  d.reachAvg = r.cent();        d.reachMax = r.cent();  d.reachSd = r.cent();
  d.aimAvg = r.cent();          d.aimSd = r.cent();

  d.jumpTotal = r.varLong();
  let n = r.varLong(), t = d.startEpochMs;
  d.jumps = [];
  for (let i = 0; i < n; i++) {
    t += r.varLong();
    const packed = r.zig();
    d.jumps.push({ t, delta: Math.floor(packed / 4), code: ((packed % 4) + 4) % 4 });
  }

  d.comboTotal = r.varLong();
  n = r.varLong(); t = d.startEpochMs;
  d.comboList = [];
  for (let i = 0; i < n; i++) {
    t += r.varLong();
    const packed = r.varLong();
    d.comboList.push({ t, interval: Math.floor(packed / 2), newCombo: packed % 2 === 1 });
  }

  d.swingTotal = r.varLong();
  n = r.varLong(); t = d.startEpochMs;
  d.swingList = [];
  for (let i = 0; i < n; i++) {
    t += r.varLong();
    const reach = r.varLong() / 100;
    const aimDeg = r.varLong() / 100;
    const offX = r.zig() / 1000;
    const offY = r.zig() / 1000;
    const packed = r.varLong();
    d.swingList.push({ t, reach, aimDeg, offX, offY, hit: packed % 2 === 1, target: Math.floor(packed / 2) - 1 });
  }

  // v4 appends input-provenance flags. Older links simply have none, which is
  // "not measured", not "came back clean" — the report says so.
  d.hasFlags = version >= 4;
  d.flagHotbar = 0; d.flagUse = 0; d.flagAttack = 0; d.flagKeybind = 0; d.flagList = []; d.flagTotal = 0;
  if (version >= 4) {
    d.flagHotbar = r.varLong(); d.flagUse = r.varLong(); d.flagAttack = r.varLong();
    d.flagKeybind = r.varLong();
    d.flagTotal = r.varLong();
    n = r.varLong(); t = d.startEpochMs;
    for (let i = 0; i < n; i++) {
      t += r.varLong();
      d.flagList.push({ t, kind: r.varLong() });
    }
  }

  // v1 links predate the ping field. The hit* fields are still read above for
  // v2 so the reader stays in sync, but nothing renders them any more.
  if (version < 2) d.pingMs = null;

  return d;
}

// ── Chart drawing ──────────────────────────────────────────────────────────
const W = 1400, H = 300, ML = 48, MR = 16, MT = 28, MB = 30;
const PW = W - ML - MR, PH = H - MT - MB;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function f2(v) { return Number(v).toFixed(2); }

// maxW caps the scatter, which looks wrong stretched. Time-series charts fill
// the page: the wider they are, the more millisecond detail is readable.
function svgOpen(w, h, maxW) {
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" style="${maxW ? `max-width:${maxW}px;` : ''}` +
         `background:#161a20;border:1px solid #2a2f37;border-radius:8px;cursor:grab;touch-action:none;">`;
}
function chartTitle(text) {
  return `<text x="${ML}" y="18" fill="#9fb3c8" font-size="13" font-family="sans-serif">${esc(text)}</text>`;
}
function noData(w, h) {
  return `<text x="${w / 2}" y="${h / 2}" fill="#5f6772" font-size="13" text-anchor="middle" ` +
         `font-family="sans-serif">no data recorded</text></svg>`;
}
// Gridlines on round values, sized to the range. Milliseconds are the point of
// these charts, so three lines at min/mid/max isn't enough to read a value off.
function niceStep(range, targetLines) {
  const raw = Math.max(1e-9, range / Math.max(1, targetLines));
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
  return step * mag;
}
function axes(yMin, yMax, unit) {
  let s = `<line x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT + PH}" stroke="#2a2f37"/>` +
          `<line x1="${ML}" y1="${MT + PH}" x2="${ML + PW}" y2="${MT + PH}" stroke="#2a2f37"/>`;
  const step = niceStep(yMax - yMin, 6);
  const label = v => step >= 1 ? String(Math.round(v)) : (step >= 0.1 ? v.toFixed(1) : v.toFixed(2));
  for (let val = Math.ceil(yMin / step) * step; val <= yMax + step * 0.001; val += step) {
    const yy = MT + PH - (val - yMin) / (yMax - yMin) * PH;
    if (yy < MT || yy > MT + PH) continue;
    const zero = Math.abs(val) < step * 0.001;
    s += `<line x1="${ML - 3}" y1="${yy}" x2="${ML + PW}" y2="${yy}" stroke="${zero ? '#3a424d' : '#21262e'}"/>` +
         `<text x="${ML - 6}" y="${yy + 3}" fill="#6b7480" font-size="10" text-anchor="end" ` +
         `font-family="sans-serif">${label(val)}</text>`;
  }
  if (unit) {
    s += `<text x="${ML - 6}" y="${MT - 8}" fill="#4a5561" font-size="9" text-anchor="end" ` +
         `font-family="sans-serif">${esc(unit)}</text>`;
  }
  return s;
}
function dot(x, y, color, tip, r) {
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r || 3}" fill="${color}" ` +
         `fill-opacity="0.8"><title>${esc(tip)}</title></circle>`;
}
function tOff(ms) { return '+' + Math.floor(ms / 1000) + '.' + String(Math.abs(ms % 1000)).padStart(3, '0') + 's'; }

function seriesChart(title, pts, d, opts) {
  let s = svgOpen(W, H) + chartTitle(title);
  if (!pts.length) return s + noData(W, H);
  let yMax = opts.baseMax || 1;
  let yMin = 0;
  for (const p of pts) { yMax = Math.max(yMax, opts.value(p)); yMin = Math.min(yMin, opts.value(p)); }
  yMax = yMax * 1.12 + (opts.pad || 0);
  const span = Math.max(1, d.endEpochMs - d.startEpochMs);
  s += axes(yMin, yMax, opts.unit);

  if (opts.refLine) {
    const ry = MT + PH - (opts.refLine - yMin) / (yMax - yMin) * PH;
    s += `<line x1="${ML}" y1="${ry}" x2="${ML + PW}" y2="${ry}" stroke="${ACCENT}" stroke-width="1" ` +
         `stroke-dasharray="4 4"/><text x="${ML + PW}" y="${ry - 4}" fill="${ACCENT}" font-size="10" ` +
         `text-anchor="end" font-family="sans-serif">${esc(opts.refLabel)}</text>`;
  }

  let poly = '', dots = '';
  for (const p of pts) {
    const x = ML + (p.t - d.startEpochMs) / span * PW;
    const y = MT + PH - (opts.value(p) - yMin) / (yMax - yMin) * PH;
    poly += `${x.toFixed(1)},${y.toFixed(1)} `;
    dots += dot(x, y, opts.color(p), opts.tip(p, d));
  }
  if (opts.line !== false) {
    s += `<polyline points="${poly.trim()}" fill="none" stroke="${opts.lineColor || HIT}" ` +
         `stroke-opacity="0.35" stroke-width="1"/>`;
  }
  return s + dots + '</svg>';
}

function aimScatter(d) {
  const w = 420, h = 460, ml = 44, mr = 16, mt = 28, mb = 34;
  const pw = w - ml - mr, ph = h - mt - mb;
  let s = svgOpen(w, h, 520) + chartTitle('Aim offset from hitbox centre (blocks)');
  if (!d.swingList.length) return s + noData(w, h);

  let halfW = HB_W * 1.6, halfH = HB_H * 1.25;
  for (const e of d.swingList) {
    halfW = Math.max(halfW, Math.abs(e.offX) * 1.1);
    halfH = Math.max(halfH, Math.abs(e.offY) * 1.1);
  }
  // One scale on both axes so the hitbox keeps its real proportions.
  const scale = Math.min(pw / (2 * halfW), ph / (2 * halfH));
  const cx = ml + pw / 2, cy = mt + ph / 2;
  const bw = HB_W * scale, bh = HB_H * scale;

  s += `<rect x="${(cx - bw).toFixed(1)}" y="${(cy - bh).toFixed(1)}" width="${(bw * 2).toFixed(1)}" ` +
       `height="${(bh * 2).toFixed(1)}" fill="${HIT}" fill-opacity="0.06" stroke="#4a5561" stroke-width="1"/>`;
  s += `<line x1="${cx.toFixed(1)}" y1="${mt}" x2="${cx.toFixed(1)}" y2="${mt + ph}" stroke="#2a2f37"/>`;
  s += `<line x1="${ml}" y1="${cy.toFixed(1)}" x2="${ml + pw}" y2="${cy.toFixed(1)}" stroke="#2a2f37"/>`;

  for (const e of d.swingList) {
    const who = e.target >= 0 && d.opponents[e.target] ? ' vs ' + d.opponents[e.target] : '';
    s += dot(cx + e.offX * scale, cy - e.offY * scale, e.hit ? HIT : MISS,
             `${f2(e.offX)}, ${f2(e.offY)} blocks / ${f2(e.aimDeg)} deg${who}`);
  }
  s += `<text x="${ml}" y="${h - 10}" fill="#6b7480" font-size="10" font-family="sans-serif">` +
       `box = player hitbox to scale &#183; green landed, red whiffed</text>`;
  return s + '</svg>';
}

// One lane per kind, so a burst reads differently from a steady cadence.
function flagChart(d) {
  const h = 182, KINDS = ['hotbar', 'use', 'attack', 'keybind'], COLORS = [ACCENT, COMBO, MISS, '#ab7df8'];
  let s = svgOpen(W, h) + chartTitle('Unattributed actions over time');
  if (!d.flagList.length) return s + noData(W, h);
  const span = Math.max(1, d.endEpochMs - d.startEpochMs);
  for (let row = 0; row < 4; row++) {
    const y = 46 + row * 32;
    s += `<text x="${ML - 6}" y="${y + 4}" fill="#6b7480" font-size="10" text-anchor="end" ` +
         `font-family="sans-serif">${KINDS[row]}</text>`;
    s += `<line x1="${ML}" y1="${y}" x2="${ML + PW}" y2="${y}" stroke="#21262e"/>`;
    for (const e of d.flagList) {
      if (e.kind !== row) continue;
      const x = ML + (e.t - d.startEpochMs) / span * PW;
      s += dot(x, y, COLORS[row], `${tOff(e.t - d.startEpochMs)} : ${KINDS[row]}`);
    }
  }
  return s + '</svg>';
}

// ── Page ───────────────────────────────────────────────────────────────────
// Wraps a chart with the readout line that click-to-read writes into.
const CHART_HINT = "Click anywhere on the chart for the nearest point's exact value.";
function chartBlock(svg) {
  return `<div class="chartwrap">${svg}<div class="readout" data-hint="${CHART_HINT}">${CHART_HINT}</div></div>`;
}

function card(v, k) { return `<div class="card"><div class="v">${v}</div><div class="k">${k}</div></div>`; }

function thinNote(shown, total, what) {
  if (shown >= total) return '';
  return `<div class="thin">Graph shows ${shown} of ${total} ${what}  the link carries an evenly spaced ` +
         `sample so it stays short enough to send. The figures above are computed over all ${total}.</div>`;
}

function head(nameOrUuid, size) {
  return `<img src="https://mc-heads.net/avatar/${encodeURIComponent(nameOrUuid)}/${size}" alt="" ` +
         `onerror="this.style.visibility='hidden'">`;
}

function render(d) {
  const dur = Math.max(0, Math.floor(d.durationMs / 1000));
  const started = new Date(d.startEpochMs).toISOString().replace('T', ' ').replace(/\..+/, ' UTC');

  let h = `<h1>${d.title ? esc(d.title) : 'Combat Tracker Session Report'}</h1>`;
  if (d.title) document.title = d.title + ' - Combat Tracker';
  h += `<div class="who">${head(d.playerUuid || d.player, 48)}<span class="ign">${esc(d.player)}</span></div>`;
  if (d.opponents.length) {
    h += `<div class="vs">vs ${d.opponents.map(o => head(o, 24) + ' ' + esc(o)).join(' &nbsp; ')}</div>`;
  }
  h += `<div class="sub">${esc(started)} &middot; ${Math.floor(dur / 60)}m ${dur % 60}s` +
       (d.pingMs != null ? ` &middot; ${Math.round(d.pingMs)} ms ping` : '') +
       ` &middot; charts: <b>click a point for its exact value</b>, scroll to zoom, drag to pan, ` +
       `double-click to reset.</div>`;

  h += `<h2>Jump resets</h2><div class="cards">` +
       card(d.jumpAttempts, 'attempts') + card(d.jumpHits, 'hits') +
       card(d.jumpAttempts - d.jumpHits, 'misses') +
       card(f2(d.jumpAvgMs) + ' ms', 'avg delta') + card(f2(d.jumpSdMs) + ' ms', 'std dev') + `</div>`;
  h += thinNote(d.jumps.length, d.jumpTotal, 'attempts');
  h += chartBlock(seriesChart('Jump-reset delta over time (ms)', d.jumps, d, {
    value: p => p.delta, color: p => p.code === 0 ? HIT : MISS, unit: 'ms',
    tip: (p, dd) => `${tOff(p.t - dd.startEpochMs)} : ${p.delta} ms (${['SUCCESS', 'TOO_EARLY', 'TOO_LATE'][p.code]})`,
  }));

  h += `<h2>Combo timing</h2><div class="cards">` +
       card(d.combos, 'combos') + card(d.comboIntervals, 'intervals') +
       card(f2(d.comboAvgMs) + ' ms', 'avg interval') + card(f2(d.comboJitterMs) + ' ms', 'jitter (SD)') + `</div>`;
  h += thinNote(d.comboList.length, d.comboTotal, 'intervals');
  h += chartBlock(seriesChart('Combo inter-hit interval over time (ms)', d.comboList, d, {
    value: p => p.interval, color: () => COMBO, lineColor: COMBO, unit: 'ms',
    tip: (p, dd) => `${tOff(p.t - dd.startEpochMs)} : ${p.interval} ms`,
  }));

  h += `<h2>Reach</h2><div class="cards">` +
       card(d.swings, 'swings') + card(d.swingHits, 'landed') + card(d.swings - d.swingHits, 'whiffed') +
       card(f2(d.reachAvg) + ' b', 'avg reach') + card(f2(d.reachMax) + ' b', 'max reach') +
       card(f2(d.reachSd) + ' b', 'std dev') + `</div>`;
  h += `<div class="sub">Green landed, red whiffed. Dashed line is vanilla melee range.</div>`;
  h += thinNote(d.swingList.length, d.swingTotal, 'swings');
  h += chartBlock(seriesChart('Reach per swing (blocks)', d.swingList, d, {
    value: p => p.reach, color: p => p.hit ? HIT : MISS, line: false, unit: 'blocks',
    baseMax: VANILLA_REACH, refLine: VANILLA_REACH, refLabel: 'vanilla 3.0',
    tip: (p, dd) => `${tOff(p.t - dd.startEpochMs)} : ${f2(p.reach)} blocks ${p.hit ? '(landed)' : '(whiffed)'}` +
                    (p.target >= 0 && dd.opponents[p.target] ? ' vs ' + dd.opponents[p.target] : ''),
  }));

  h += `<h2>Aim placement</h2><div class="cards">` +
       card(f2(d.aimAvg) + '&deg;', 'avg off-centre') + card(f2(d.aimSd) + '&deg;', 'std dev') + `</div>`;
  h += `<div class="sub">Hitbox drawn to scale. Green landed, red whiffed.</div>`;
  h += chartBlock(aimScatter(d));

  h += `<h2>Input provenance</h2>`;
  if (!d.hasFlags) {
    h += `<div class="sub">This link predates input tracking, so nothing was measured here. ` +
         `That is not the same as coming back clean.</div>`;
  } else if (d.flagHotbar + d.flagUse + d.flagAttack + d.flagKeybind === 0) {
    h += `<div class="sub">Every attack, item use and hotbar change came from the keyboard, the mouse ` +
         `wheel or the server, and every keybind moved because a key or button physically moved. ` +
         `Nothing was driven by anything else.</div>`;
  } else {
    h += `<div class="cards">` +
         card(d.flagHotbar, 'hotbar switches') + card(d.flagUse, 'item uses') +
         card(d.flagAttack, 'attacks') + card(d.flagKeybind, 'keybinds') + `</div>`;
    h += `<div class="sub">These happened while none of the vanilla input paths were running — not a ` +
         `number key, not the scroll wheel, not the server moving your hand. <span class="warn">Not by ` +
         `itself proof of cheating:</span> any mod that swaps your hotbar or triggers a use looks ` +
         `identical from here. It does mean something other than your hands did it.<br><br>Keybind counts in ` +
         `particular: a controller mod drives the game by setting keybinds rather than sending key events, so ` +
         `playing on a controller produces a large, steady keybind count with nothing wrong at all. ` +
         `Toggle-sprint and similar accessibility mods do the same. Read the other three rows first.</div>`;
    h += thinNote(d.flagList.length, d.flagTotal, 'events');
    h += chartBlock(flagChart(d));
  }

  h += `<h2>About</h2><div class="note">Generated by ` +
       `<a href="https://github.com/builtdoor1/Combat-Tracker" style="color:#29b6f6">Combat Tracker</a>, a ` +
       `client-side Minecraft mod that only observes. It never changes movement, reach or aim.` +
       `<br><br><span class="warn">Read honestly:</span> the session travels inside this link, so nothing was ` +
       `uploaded and nothing verified it. This page carries no signature to check — it renders what the link ` +
       `says, including the name and skin above, which are just text in the payload. Anyone can write one of ` +
       `these links from scratch in minutes, in any name, with no mod and no recompile. Reach and aim are ` +
       `measured on the player's own client. Treat it as a record of a fight, not proof.</div>`;

  document.getElementById('app').innerHTML = h;
  attachPanZoom();
  revealOnScroll();
}

// Pan, zoom, and click-to-read. Kept in step with ReportBuilder.chartScript() in
// the mod. The offline report and this page behave identically on purpose.
//
// A click selects the NEAREST point rather than demanding a direct hit: the dots
// are three pixels across and hitting one exactly is not realistic on a dense
// chart. The search radius scales with zoom so it stays constant on screen, and
// drags are excluded by distance travelled so panning doesn't select anything.
// Sections fade up once as they enter the viewport. Cheap, and it gives a long
// report a sense of order rather than dumping everything at once.
function revealOnScroll() {
  const targets = [...document.querySelectorAll('h2,.cards,.chartwrap,.who,.vs,.note,.thin')];
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const show = el => el.classList.add('shown');

  if (reduced || !('IntersectionObserver' in window)) return;

  // Two frames so layout has settled: the charts are percentage-width and have no
  // resolved height at end-of-body, so measuring there finds nothing below the
  // fold. If frames never run, the reveal never applies and everything stays
  // visible, which is the outcome we want anyway.
  requestAnimationFrame(() => requestAnimationFrame(() => {

  // Only what is below the fold is ever made transparent. Anything already on
  // screen is left alone, so the page cannot open blank even if the observer
  // never fires.
  targets.forEach(el => {
    if (el.getBoundingClientRect().top >= window.innerHeight) el.classList.add('reveal');
  });

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) { show(en.target); io.unobserve(en.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  targets.forEach(el => { if (el.classList.contains('reveal')) io.observe(el); });

  // Failsafe. A page that never appears is far worse than one that appears
  // without the animation, so nothing stays hidden if the observer never fires.
  setTimeout(() => targets.forEach(show), 1200);
  }));
}

function attachPanZoom() {
  document.querySelectorAll('svg.chart').forEach(function (svg) {
    const vb = svg.getAttribute('viewBox').split(' ').map(Number);
    const init = vb.slice();
    let v = { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
    const ap = () => svg.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);

    const out = svg.parentNode.querySelector('.readout');
    let sel = null;
    function clearSel() {
      if (sel) { sel.removeAttribute('data-sel'); sel = null; }
      if (out) { out.textContent = out.getAttribute('data-hint'); out.classList.remove('on'); }
    }
    function pick(c) {
      if (sel) sel.removeAttribute('data-sel');
      sel = c; c.setAttribute('data-sel', '1');
      if (out) {
        const t = c.querySelector('title');
        out.textContent = t ? t.textContent : '';
        out.classList.add('on');
      }
    }

    svg.addEventListener('wheel', function (e) {
      e.preventDefault();
      const r = svg.getBoundingClientRect();
      const mx = v.x + (e.clientX - r.left) / r.width * v.w;
      const my = v.y + (e.clientY - r.top) / r.height * v.h;
      const f = e.deltaY < 0 ? 0.85 : 1 / 0.85;
      v.w *= f; v.h *= f;
      v.x = mx - (e.clientX - r.left) / r.width * v.w;
      v.y = my - (e.clientY - r.top) / r.height * v.h;
      ap();
    }, { passive: false });

    let dragging = false, lx = 0, ly = 0, moved = 0;
    svg.addEventListener('mousedown', e => {
      dragging = true; lx = e.clientX; ly = e.clientY; moved = 0; svg.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      moved += Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly);
      const r = svg.getBoundingClientRect();
      v.x -= (e.clientX - lx) / r.width * v.w;
      v.y -= (e.clientY - ly) / r.height * v.h;
      lx = e.clientX; ly = e.clientY; ap();
    });
    window.addEventListener('mouseup', () => { dragging = false; svg.style.cursor = 'grab'; });

    svg.addEventListener('click', function (e) {
      if (moved > 4) return;   // that was a pan, not a click
      const r = svg.getBoundingClientRect();
      const ux = v.x + (e.clientX - r.left) / r.width * v.w;
      const uy = v.y + (e.clientY - r.top) / r.height * v.h;
      let best = null, bd = Infinity;
      svg.querySelectorAll('circle').forEach(function (c) {
        const dx = +c.getAttribute('cx') - ux, dy = +c.getAttribute('cy') - uy;
        const dd = dx * dx + dy * dy;
        if (dd < bd) { bd = dd; best = c; }
      });
      const lim = 14 * (v.w / init[2]);
      if (best && bd <= lim * lim) pick(best); else clearSel();
    });

    // Ease the viewBox back rather than snapping, so the reset reads as a movement
    // you can follow instead of a jump cut.
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    svg.addEventListener('dblclick', () => {
      clearSel();
      if (reduced) { v = { x: init[0], y: init[1], w: init[2], h: init[3] }; ap(); return; }
      const from = { ...v }, t0 = performance.now();
      const step = now => {
        const k = Math.min(1, (now - t0) / 260);
        const e = 1 - Math.pow(1 - k, 3);
        v.x = from.x + (init[0] - from.x) * e;
        v.y = from.y + (init[1] - from.y) * e;
        v.w = from.w + (init[2] - from.w) * e;
        v.h = from.h + (init[3] - from.h) * e;
        ap();
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  });
}

function showMessage(title, body) {
  document.getElementById('app').innerHTML =
    `<h1>${esc(title)}</h1><div class="sub" id="empty">${body}</div>`;
}

async function boot() {
  const frag = location.hash.replace(/^#/, '').trim();
  if (!frag) {
    showMessage('Combat Tracker', 'This page renders a Combat Tracker session that is carried entirely inside ' +
      'the link  there is no server and nothing is stored here. Open a session link to view it, or grab ' +
      'the mod from <a href="https://github.com/builtdoor1/Combat-Tracker" style="color:#29b6f6">GitHub</a> and ' +
      'record your own with <code>Stop Recording</code>.');
    return;
  }
  if (typeof DecompressionStream === 'undefined') {
    showMessage('Unsupported browser', 'This page needs <code>DecompressionStream</code> to unpack the session. ' +
      'Any current Chrome, Edge, Firefox or Safari has it.');
    return;
  }
  try {
    render(decode(await inflateRaw(b64urlToBytes(frag))));
  } catch (err) {
    showMessage('Could not read this link', 'The session data appears truncated or corrupted  chat clients ' +
      'sometimes cut long links in half. Ask for it again as a full copy-paste.<br><br><code>' +
      esc(err && err.message ? err.message : String(err)) + '</code>');
  }
}

window.addEventListener('hashchange', boot);
boot();
</script>
</body>
</html>
