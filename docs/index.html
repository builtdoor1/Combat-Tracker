<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat Tracker Session</title>
<style>
  /* Tokens. One scale for space, type, depth and motion, so a change is made in
     one place rather than hunted through the file. Values are fluid: this page is
     read on a phone in a Discord in-app browser as often as on a desktop. */
  :root{
    color-scheme: dark;

    --bg:        #14161a;
    --bg-elev:   #191d24;
    --panel:     #1e232b;
    --line:      #2a2f37;
    --line-hi:   #3d4550;

    --text:      #e8eaed;
    --muted:     #9aa4b2;
    /* Not dimmer than this. --dim carries the readout's resting hint — the line
       that tells you click-to-read exists at all — and the old #6b7480 came to
       3.6:1 on the panel, under the 4.5:1 WCAG AA floor for text this size. This
       clears it on all three backgrounds and still reads as the quiet tier. */
    --dim:       #828c99;

    --accent:    #ffb454;
    --hit:       #4caf50;
    --miss:      #ef5350;
    --combo:     #29b6f6;

    /* Fluid type. The floor is what a phone gets; the ceiling stops headings
       becoming billboards on a wide monitor. */
    --t-xs:  clamp(0.72rem, 0.70rem + 0.10vw, 0.78rem);
    --t-sm:  clamp(0.80rem, 0.77rem + 0.15vw, 0.88rem);
    --t-base:clamp(0.90rem, 0.86rem + 0.20vw, 1.00rem);
    --t-lg:  clamp(1.05rem, 0.98rem + 0.35vw, 1.25rem);
    --t-xl:  clamp(1.35rem, 1.15rem + 1.00vw, 2.00rem);
    --t-2xl: clamp(1.75rem, 1.40rem + 1.75vw, 2.75rem);

    --s-1: clamp(0.25rem, 0.22rem + 0.15vw, 0.375rem);
    --s-2: clamp(0.5rem,  0.45rem + 0.25vw, 0.75rem);
    --s-3: clamp(0.75rem, 0.65rem + 0.5vw,  1.125rem);
    --s-4: clamp(1rem,    0.85rem + 0.75vw, 1.5rem);
    --s-6: clamp(1.5rem,  1.25rem + 1.25vw, 2.25rem);
    --s-8: clamp(2rem,    1.6rem + 2vw,     3rem);

    --r-sm: 8px; --r-md: 12px; --r-lg: 16px;

    --e1: 0 1px 2px rgba(0,0,0,.35);
    --e2: 0 4px 14px rgba(0,0,0,.38);
    --e3: 0 12px 32px rgba(0,0,0,.42);

    --fast: 130ms; --med: 240ms;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box; margin:0;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(1100px 560px at 50% -12%, rgba(64,80,110,.30), transparent 70%),
      var(--bg);
    color:var(--text);
    font-size:var(--t-base);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:var(--s-4);
  }
  main{ max-width:1180px; margin-inline:auto; }

  /* Header */
  .hero{
    display:flex; align-items:center; gap:var(--s-4); flex-wrap:wrap;
    padding:var(--s-4); margin-bottom:var(--s-4);
    background:linear-gradient(160deg, var(--panel), var(--bg-elev));
    border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--e2);
  }
  .hero__avatar{
    width:clamp(56px,10vw,76px); height:clamp(56px,10vw,76px); flex:none;
    image-rendering:pixelated; border-radius:var(--r-md);
    background:var(--bg-elev); box-shadow:var(--e1);
  }
  .hero__text{ min-width:0; flex:1 1 16rem; }
  h1{ font-size:var(--t-2xl); line-height:1.15; letter-spacing:-.02em; font-weight:650;
      overflow-wrap:anywhere; }
  .hero__ign{ font-size:var(--t-lg); font-weight:600; color:var(--accent);
              letter-spacing:-.01em; overflow-wrap:anywhere; }
  .vs{ display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap;
       color:var(--muted); font-size:var(--t-sm); margin-top:var(--s-2); }
  .vs img{ width:22px; height:22px; image-rendering:pixelated; border-radius:5px;
           background:var(--bg-elev); vertical-align:middle; }
  .vs__label{ color:var(--dim); }

  /* Facts as discrete chips rather than a run-on sentence. */
  .meta{ display:flex; gap:var(--s-2); flex-wrap:wrap; margin-top:var(--s-3); }
  .chip{
    font-size:var(--t-xs); color:var(--muted); white-space:nowrap;
    padding:.28em .7em; border:1px solid var(--line); border-radius:999px;
    background:rgba(255,255,255,.03);
    font-variant-numeric:tabular-nums;
  }

  /* Sections */
  section{ margin-top:var(--s-8); }
  h2{
    font-size:var(--t-lg); font-weight:600; letter-spacing:-.01em;
    display:flex; align-items:baseline; gap:var(--s-2); margin-bottom:var(--s-3);
  }
  h2::after{ content:""; flex:1; height:1px;
             background:linear-gradient(90deg,var(--line),transparent); }
  .sub{ color:var(--muted); font-size:var(--t-sm); margin-bottom:var(--s-3); }
  .sub b{ color:var(--text); font-weight:600; }

  /* Stat cards. auto-fit rather than flex-wrap, so cards share width evenly
     instead of leaving one stranded on its own row. */
  .cards{
    display:grid; gap:var(--s-2); margin-bottom:var(--s-3);
    grid-template-columns:repeat(auto-fit,minmax(clamp(6.5rem,18vw,8.5rem),1fr));
  }
  .card{
    background:var(--bg-elev); border:1px solid var(--line);
    border-radius:var(--r-md); padding:var(--s-3); box-shadow:var(--e1);
    transition:transform var(--med) var(--ease), border-color var(--med) var(--ease),
               box-shadow var(--med) var(--ease);
  }
  @media (hover:hover){
    .card:hover{ transform:translateY(-2px); border-color:var(--line-hi); box-shadow:var(--e2); }
  }
  .card .v{
    font-size:var(--t-xl); font-weight:650; letter-spacing:-.02em; line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .card .k{ font-size:var(--t-xs); color:var(--muted); margin-top:.15em; }

  /* Charts */
  .chartwrap{
    margin-bottom:var(--s-4); padding:var(--s-2);
    background:var(--bg-elev); border:1px solid var(--line);
    border-radius:var(--r-lg); box-shadow:var(--e1);
    transition:border-color var(--med) var(--ease), box-shadow var(--med) var(--ease);
  }
  @media (hover:hover){ .chartwrap:hover{ border-color:var(--line-hi); box-shadow:var(--e2); } }
  /* No touch-action here. It used to be `none`, which suppresses the browser's own
     panning — and pan/zoom binds mouse events only, so nothing ever replaced the
     gesture it suppressed. On a phone that made the scroller below unreachable and
     swallowed vertical page scrolling over every chart. The browser owns touch. */
  svg.chart{ display:block; background:#161a20; border:1px solid var(--line);
    border-radius:var(--r-md); cursor:grab; }
  svg.chart circle{ cursor:pointer;
    transition:r var(--fast) var(--ease), stroke-width var(--fast) var(--ease); }
  svg.chart circle:hover{ stroke:#fff; stroke-width:1.5; r:4.5; }
  svg.chart circle[data-sel]{ stroke:#fff; stroke-width:2.5; r:5; }

  /* The readout is an aria-live region, so it must not collapse when empty or a
     screen reader announces a layout jump instead of a value. */
  .readout{
    font-family:ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size:var(--t-xs); color:var(--dim);
    padding:var(--s-2) var(--s-1) var(--s-1); min-height:2.2em;
    transition:color var(--med) var(--ease);
  }
  /* The value swap gets a short lift so a changed reading is noticeable — clicking
     a second point otherwise just edits text in place, with nothing to catch the
     eye. Matches the saved report, which kept this when the viewer lost it. */
  .readout.on{ color:var(--text); animation:ctIn var(--med) var(--ease); }
  @keyframes ctIn{ from{ opacity:0; transform:translateY(3px); } to{ opacity:1; transform:none; } }

  .thin{
    color:var(--accent); font-size:var(--t-xs); line-height:1.5;
    margin-bottom:var(--s-3); padding:var(--s-2) var(--s-3);
    border-left:2px solid var(--accent); border-radius:0 var(--r-sm) var(--r-sm) 0;
    background:rgba(255,180,84,.07);
  }

  .note{
    background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--s-4); font-size:var(--t-sm); line-height:1.65; color:var(--muted);
  }
  .note strong{ color:var(--text); font-weight:600; }
  .warn{ color:var(--accent); font-weight:600; }

  a{ color:var(--combo); text-decoration:none; border-bottom:1px solid transparent;
     transition:border-color var(--fast) var(--ease); }
  a:hover{ border-bottom-color:currentColor; }
  code{ background:#0f1114; padding:.15em .45em; border-radius:5px;
        font-size:.92em; border:1px solid var(--line);
        font-family:ui-monospace, Consolas, monospace; }

  /* No loading skeleton. One was written for the async decode, but the session
     arrives in the URL rather than over the network, so the wait it covered is not
     measurable and a skeleton would only flash. Styling a state nothing emits reads
     as a state that exists. */
  .msg{ max-width:62ch; line-height:1.7; color:var(--muted); }
  .msg h1{ margin-bottom:var(--s-3); }

  /* Motion and focus */
  .reveal{ opacity:0; transform:translateY(12px);
           transition:opacity 420ms var(--ease), transform 420ms var(--ease); }
  .reveal.shown{ opacity:1; transform:none; }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important;
                          transition-duration:.01ms !important; }
    .reveal{ opacity:1; transform:none; }
  }

  /* Charts carry millisecond detail that does not survive being squeezed onto a
     phone, so below this width they scroll sideways at a readable size instead.
     The width is the charts' own design width, not a smaller round number: the
     axis text is sized in user units, so anything less scales it down with
     everything else. At 680px it came out at 4.9 CSS px — scrolling for labels
     still too small to read, which is the worst of both. 1:1 is the whole point. */
  @media (max-width:640px){
    .chart-scroll{ overflow-x:auto; overscroll-behavior-x:contain; }
    .chart-scroll svg.chart:not(.chart--fit){ min-width:1400px; }
  }
</style>
</head>
<body>
<main id="app" aria-busy="true"></main>

<script>
const HIT = '#4caf50', MISS = '#ef5350', COMBO = '#29b6f6', ACCENT = '#ffb454';
// Greys inside the charts. Named here because they were the last colours still
// written inline at each use, and they had drifted below the contrast floor
// unnoticed: on the #161a20 chart the tick labels sat at 3.7:1, the unit caption
// at 2.3:1 and the empty-chart label at 3.1:1, against 4.5:1 for text. HITBOX is
// a graphic rather than text, so it answers to the 3:1 floor instead.
const AXIS_TX = '#828c99', NODATA = '#9aa4b2', HITBOX = '#6b7480';
const VANILLA_REACH = 3.0, HB_W = 0.3, HB_H = 0.9;

// ── Binary reader ──────────────────────────────────────────────────────────
// Mirrors SharePayload's writer exactly. Bit operators are avoided for the wide
// values: JavaScript's are 32-bit, and an epoch timestamp needs 41.
class Reader {
  constructor(bytes) { this.b = bytes; this.p = 0; }
  u8()      { return this.b[this.p++]; }
  varLong() {
    let result = 0, shift = 0, byte;
    do { byte = this.b[this.p++]; result += (byte & 0x7f) * Math.pow(2, shift); shift += 7; }
    while (byte & 0x80);
    return result;
  }
  zig()  { const n = this.varLong(); return (n % 2 === 0) ? n / 2 : -(n + 1) / 2; }
  cent() { return this.zig() / 100; }
  str()  {
    const len = this.varLong();
    const slice = this.b.subarray(this.p, this.p + len);
    this.p += len;
    return new TextDecoder().decode(slice);
  }
}

function b64urlToBytes(s) {
  const pad = s.length % 4 === 0 ? '' : '='.repeat(4 - (s.length % 4));
  const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/') + pad);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function decode(raw) {
  const r = new Reader(raw);
  const version = r.u8();
  if (version < 1 || version > 4) {
    throw new Error('This link uses format version ' + version + ', which this page cannot read yet.');
  }

  const d = { version };
  d.player = r.str();
  d.playerUuid = r.str();
  // v3 carries a label for the session; older links simply have none.
  d.title = version >= 3 ? (r.str() || null) : null;
  d.startEpochMs = r.varLong();
  d.durationMs = r.varLong();
  d.endEpochMs = d.startEpochMs + d.durationMs;

  const oc = r.varLong();
  d.opponents = [];
  for (let i = 0; i < oc; i++) d.opponents.push(r.str());

  d.jumpAttempts = r.varLong(); d.jumpHits = r.varLong();
  d.jumpAvgMs = r.cent();       d.jumpSdMs = r.cent();
  if (version >= 2) {
    d.pingMs = r.varLong();
    r.cent(); r.cent();   // hitAvgMs / hitSdMs, retained in the format
    r.zig();  r.zig();    // hitMinMs / hitMaxMs
  }
  d.combos = r.varLong();       d.comboIntervals = r.varLong();
  d.comboAvgMs = r.cent();      d.comboJitterMs = r.cent();
  d.swings = r.varLong();       d.swingHits = r.varLong();
  d.reachAvg = r.cent();        d.reachMax = r.cent();  d.reachSd = r.cent();
  d.aimAvg = r.cent();          d.aimSd = r.cent();

  d.jumpTotal = r.varLong();
  let n = r.varLong(), t = d.startEpochMs;
  d.jumps = [];
  for (let i = 0; i < n; i++) {
    t += r.varLong();
    const packed = r.zig();
    d.jumps.push({ t, delta: Math.floor(packed / 4), code: ((packed % 4) + 4) % 4 });
  }

  d.comboTotal = r.varLong();
  n = r.varLong(); t = d.startEpochMs;
  d.comboList = [];
  for (let i = 0; i < n; i++) {
    t += r.varLong();
    const packed = r.varLong();
    d.comboList.push({ t, interval: Math.floor(packed / 2), newCombo: packed % 2 === 1 });
  }

  d.swingTotal = r.varLong();
  n = r.varLong(); t = d.startEpochMs;
  d.swingList = [];
  for (let i = 0; i < n; i++) {
    t += r.varLong();
    const reach = r.varLong() / 100;
    const aimDeg = r.varLong() / 100;
    const offX = r.zig() / 1000;
    const offY = r.zig() / 1000;
    const packed = r.varLong();
    d.swingList.push({ t, reach, aimDeg, offX, offY, hit: packed % 2 === 1, target: Math.floor(packed / 2) - 1 });
  }

  // v4 carries four trailing counters and a series. They are read and discarded:
  // the reader has to consume them to stay aligned with the byte stream, and
  // skipping them would break every v4 link, but nothing on this page renders them.
  if (version >= 4) {
    r.varLong(); r.varLong(); r.varLong(); r.varLong();
    r.varLong();
    n = r.varLong();
    for (let i = 0; i < n; i++) { r.varLong(); r.varLong(); }
  }

  // v1 links predate the ping field. The hit* fields are still read above for
  // v2 so the reader stays in sync, but nothing renders them any more.
  if (version < 2) d.pingMs = null;

  return d;
}

// ── Chart drawing ──────────────────────────────────────────────────────────
const W = 1400, H = 300, ML = 48, MR = 16, MT = 28, MB = 30;
const PW = W - ML - MR, PH = H - MT - MB;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function f2(v) { return Number(v).toFixed(2); }

// maxW caps the scatter, which looks wrong stretched. Time-series charts fill
// the page: the wider they are, the more millisecond detail is readable.
// Inline style carries max-width only — the one value that genuinely varies per
// chart. Everything else lives in the svg.chart rule, because an inline
// declaration beats the stylesheet and this one was quietly winning: the report
// moved its frame into CSS and the viewer kept painting the old one inline, so
// the two surfaces had started drawing the same chart differently.
function svgOpen(w, h, maxW) {
  // A capped chart is also marked, because the mobile min-width that keeps the
  // wide time-series readable would otherwise beat the cap — min-width wins over
  // max-width — and inflate the squarish scatter to full height on a phone.
  return `<svg class="chart${maxW ? ' chart--fit' : ''}" viewBox="0 0 ${w} ${h}" width="100%"` +
         `${maxW ? ` style="max-width:${maxW}px;"` : ''}>`;
}
function chartTitle(text) {
  return `<text x="${ML}" y="18" fill="#9fb3c8" font-size="13" font-family="sans-serif">${esc(text)}</text>`;
}
function noData(w, h) {
  return `<text x="${w / 2}" y="${h / 2}" fill="${NODATA}" font-size="13" text-anchor="middle" ` +
         `font-family="sans-serif">no data recorded</text></svg>`;
}
// Gridlines on round values, sized to the range. Milliseconds are the point of
// these charts, so three lines at min/mid/max isn't enough to read a value off.
function niceStep(range, targetLines) {
  const raw = Math.max(1e-9, range / Math.max(1, targetLines));
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
  return step * mag;
}
function axes(yMin, yMax, unit) {
  let s = `<line x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT + PH}" stroke="#2a2f37"/>` +
          `<line x1="${ML}" y1="${MT + PH}" x2="${ML + PW}" y2="${MT + PH}" stroke="#2a2f37"/>`;
  const step = niceStep(yMax - yMin, 6);
  const label = v => step >= 1 ? String(Math.round(v)) : (step >= 0.1 ? v.toFixed(1) : v.toFixed(2));
  for (let val = Math.ceil(yMin / step) * step; val <= yMax + step * 0.001; val += step) {
    const yy = MT + PH - (val - yMin) / (yMax - yMin) * PH;
    if (yy < MT || yy > MT + PH) continue;
    const zero = Math.abs(val) < step * 0.001;
    s += `<line x1="${ML - 3}" y1="${yy}" x2="${ML + PW}" y2="${yy}" stroke="${zero ? '#3a424d' : '#21262e'}"/>` +
         `<text x="${ML - 6}" y="${yy + 3}" fill="${AXIS_TX}" font-size="10" text-anchor="end" ` +
         `font-family="sans-serif">${label(val)}</text>`;
  }
  if (unit) {
    s += `<text x="${ML - 6}" y="${MT - 8}" fill="${AXIS_TX}" font-size="9" text-anchor="end" ` +
         `font-family="sans-serif">${esc(unit)}</text>`;
  }
  return s;
}
function dot(x, y, color, tip, r) {
  return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r || 3}" fill="${color}" ` +
         `fill-opacity="0.8"><title>${esc(tip)}</title></circle>`;
}
function tOff(ms) { return '+' + Math.floor(ms / 1000) + '.' + String(Math.abs(ms % 1000)).padStart(3, '0') + 's'; }

function seriesChart(title, pts, d, opts) {
  let s = svgOpen(W, H) + chartTitle(title);
  if (!pts.length) return s + noData(W, H);
  let yMax = opts.baseMax || 1;
  let yMin = 0;
  for (const p of pts) { yMax = Math.max(yMax, opts.value(p)); yMin = Math.min(yMin, opts.value(p)); }
  yMax = yMax * 1.12 + (opts.pad || 0);
  const span = Math.max(1, d.endEpochMs - d.startEpochMs);
  s += axes(yMin, yMax, opts.unit);

  if (opts.refLine) {
    const ry = MT + PH - (opts.refLine - yMin) / (yMax - yMin) * PH;
    s += `<line x1="${ML}" y1="${ry}" x2="${ML + PW}" y2="${ry}" stroke="${ACCENT}" stroke-width="1" ` +
         `stroke-dasharray="4 4"/><text x="${ML + PW}" y="${ry - 4}" fill="${ACCENT}" font-size="10" ` +
         `text-anchor="end" font-family="sans-serif">${esc(opts.refLabel)}</text>`;
  }

  let poly = '', dots = '';
  for (const p of pts) {
    const x = ML + (p.t - d.startEpochMs) / span * PW;
    const y = MT + PH - (opts.value(p) - yMin) / (yMax - yMin) * PH;
    poly += `${x.toFixed(1)},${y.toFixed(1)} `;
    dots += dot(x, y, opts.color(p), opts.tip(p, d));
  }
  if (opts.line !== false) {
    s += `<polyline points="${poly.trim()}" fill="none" stroke="${opts.lineColor || HIT}" ` +
         `stroke-opacity="0.35" stroke-width="1"/>`;
  }
  return s + dots + '</svg>';
}

function aimScatter(d) {
  const w = 420, h = 460, ml = 44, mr = 16, mt = 28, mb = 34;
  const pw = w - ml - mr, ph = h - mt - mb;
  let s = svgOpen(w, h, 520) + chartTitle('Aim offset from hitbox centre (blocks)');
  if (!d.swingList.length) return s + noData(w, h);

  let halfW = HB_W * 1.6, halfH = HB_H * 1.25;
  for (const e of d.swingList) {
    halfW = Math.max(halfW, Math.abs(e.offX) * 1.1);
    halfH = Math.max(halfH, Math.abs(e.offY) * 1.1);
  }
  // One scale on both axes so the hitbox keeps its real proportions.
  const scale = Math.min(pw / (2 * halfW), ph / (2 * halfH));
  const cx = ml + pw / 2, cy = mt + ph / 2;
  const bw = HB_W * scale, bh = HB_H * scale;

  s += `<rect x="${(cx - bw).toFixed(1)}" y="${(cy - bh).toFixed(1)}" width="${(bw * 2).toFixed(1)}" ` +
       `height="${(bh * 2).toFixed(1)}" fill="${HIT}" fill-opacity="0.06" stroke="${HITBOX}" stroke-width="1"/>`;
  s += `<line x1="${cx.toFixed(1)}" y1="${mt}" x2="${cx.toFixed(1)}" y2="${mt + ph}" stroke="#2a2f37"/>`;
  s += `<line x1="${ml}" y1="${cy.toFixed(1)}" x2="${ml + pw}" y2="${cy.toFixed(1)}" stroke="#2a2f37"/>`;

  for (const e of d.swingList) {
    const who = e.target >= 0 && d.opponents[e.target] ? ' vs ' + d.opponents[e.target] : '';
    s += dot(cx + e.offX * scale, cy - e.offY * scale, e.hit ? HIT : MISS,
             `${f2(e.offX)}, ${f2(e.offY)} blocks / ${f2(e.aimDeg)} deg${who}`);
  }
  s += `<text x="${ml}" y="${h - 10}" fill="${AXIS_TX}" font-size="10" font-family="sans-serif">` +
       `box = player hitbox to scale &#183; green landed, red whiffed</text>`;
  return s + '</svg>';
}

// ── Page ───────────────────────────────────────────────────────────────────
// Wraps a chart with the readout line that click-to-read writes into.
const CHART_HINT = "Click anywhere on the chart for the nearest point's exact value.";

/**
 * A chart plus the readout that click-to-read writes into.
 *
 * The readout is an aria-live region: without it a click announces nothing and
 * only sighted users get the feature. The inner scroller lets a 1400-wide chart
 * keep a readable scale on a phone instead of being squashed to illegibility.
 */
function chartBlock(svg) {
  return `<div class="chartwrap"><div class="chart-scroll">${svg}</div>` +
         `<div class="readout" role="status" aria-live="polite" ` +
         `data-hint="${CHART_HINT}">${CHART_HINT}</div></div>`;
}

function card(v, k) { return `<div class="card"><div class="v">${v}</div><div class="k">${k}</div></div>`; }

function cards(list) { return `<div class="cards">${list.join('')}</div>`; }

/** A single fact, as a chip rather than one more clause in a sentence. */
function chip(text) { return `<span class="chip">${text}</span>`; }

/** One titled block. In one place so the sections cannot drift apart. */
function section(title, inner) { return `<section><h2>${esc(title)}</h2>${inner}</section>`; }

function thinNote(shown, total, what) {
  if (shown >= total) return '';
  return `<div class="thin">Graph shows ${shown} of ${total} ${what} — the link carries an evenly spaced ` +
         `sample so it stays short enough to send. The figures above are computed over all ${total}.</div>`;
}

function head(nameOrUuid, size, cls) {
  return `<img class="${cls || ''}" src="https://mc-heads.net/avatar/${encodeURIComponent(nameOrUuid)}/${size}" ` +
         `alt="" width="${size}" height="${size}" loading="lazy" ` +
         `onerror="this.style.visibility='hidden'">`;
}

function render(d) {
  const dur = Math.max(0, Math.floor(d.durationMs / 1000));
  const started = new Date(d.startEpochMs).toISOString().replace('T', ' ').replace(/\..+/, ' UTC');
  if (d.title) document.title = d.title + ' - Combat Tracker';

  // Identity first and largest. The question a reader opens this page with is
  // "whose fight is this", and that used to be answered by a line of body text.
  let h = `<header class="hero">` +
      head(d.playerUuid || d.player, 76, 'hero__avatar') +
      `<div class="hero__text">` +
        `<h1>${d.title ? esc(d.title) : 'Combat Tracker session'}</h1>` +
        `<div class="hero__ign">${esc(d.player)}</div>` +
        (d.opponents.length
          ? `<div class="vs"><span class="vs__label">vs</span>` +
            d.opponents.map(o => `<span>${head(o, 22)} ${esc(o)}</span>`).join('') + `</div>`
          : '') +
        `<div class="meta">` +
          chip(esc(started)) +
          chip(`${Math.floor(dur / 60)}m ${dur % 60}s`) +
          (d.pingMs != null ? chip(`${Math.round(d.pingMs)} ms ping`) : '') +
        `</div>` +
      `</div></header>`;

  h += `<p class="sub">Charts: <b>click a point for its exact value</b>, scroll to zoom, ` +
       `drag to pan, double-click to reset.</p>`;

  h += section('Jump resets',
    cards([
      card(d.jumpAttempts, 'attempts'),
      card(d.jumpHits, 'hits'),
      card(d.jumpAttempts - d.jumpHits, 'misses'),
      card(f2(d.jumpAvgMs) + ' ms', 'avg delta'),
      card(f2(d.jumpSdMs) + ' ms', 'std dev'),
    ]) +
    thinNote(d.jumps.length, d.jumpTotal, 'attempts') +
    chartBlock(seriesChart('Jump-reset delta over time (ms)', d.jumps, d, {
      value: p => p.delta, color: p => p.code === 0 ? HIT : MISS, unit: 'ms',
      tip: (p, dd) => `${tOff(p.t - dd.startEpochMs)} : ${p.delta} ms (${['SUCCESS', 'TOO_EARLY', 'TOO_LATE'][p.code]})`,
    })));

  h += section('Combo timing',
    cards([
      card(d.combos, 'combos'),
      card(d.comboIntervals, 'intervals'),
      card(f2(d.comboAvgMs) + ' ms', 'avg interval'),
      card(f2(d.comboJitterMs) + ' ms', 'jitter (SD)'),
    ]) +
    thinNote(d.comboList.length, d.comboTotal, 'intervals') +
    chartBlock(seriesChart('Combo inter-hit interval over time (ms)', d.comboList, d, {
      value: p => p.interval, color: () => COMBO, lineColor: COMBO, unit: 'ms',
      tip: (p, dd) => `${tOff(p.t - dd.startEpochMs)} : ${p.interval} ms`,
    })));

  h += section('Reach',
    cards([
      card(d.swings, 'swings'),
      card(d.swingHits, 'landed'),
      card(d.swings - d.swingHits, 'whiffed'),
      card(f2(d.reachAvg) + ' b', 'avg reach'),
      card(f2(d.reachMax) + ' b', 'max reach'),
      card(f2(d.reachSd) + ' b', 'std dev'),
    ]) +
    `<p class="sub">Green landed, red whiffed. Dashed line is vanilla melee range.</p>` +
    thinNote(d.swingList.length, d.swingTotal, 'swings') +
    chartBlock(seriesChart('Reach per swing (blocks)', d.swingList, d, {
      value: p => p.reach, color: p => p.hit ? HIT : MISS, line: false, unit: 'blocks',
      baseMax: VANILLA_REACH, refLine: VANILLA_REACH, refLabel: 'vanilla 3.0',
      tip: (p, dd) => `${tOff(p.t - dd.startEpochMs)} : ${f2(p.reach)} blocks ${p.hit ? '(landed)' : '(whiffed)'}` +
                      (p.target >= 0 && dd.opponents[p.target] ? ' vs ' + dd.opponents[p.target] : ''),
    })));

  h += section('Aim placement',
    cards([
      card(f2(d.aimAvg) + '&deg;', 'avg off-centre'),
      card(f2(d.aimSd) + '&deg;', 'std dev'),
    ]) +
    `<p class="sub">Hitbox drawn to scale. Green landed, red whiffed.</p>` +
    chartBlock(aimScatter(d)));

  h += section('About', `<div class="note">Generated by ` +
    `<a href="https://github.com/builtdoor1/Combat-Tracker">Combat Tracker</a>, a ` +
    `client-side Minecraft mod that only observes. It never changes movement, reach or aim.` +
    `<br><br><span class="warn">Read honestly:</span> the session travels inside this link, so nothing was ` +
    `uploaded and nothing verified it. This page carries no signature to check — it renders what the link ` +
    `says, including the name and skin above, which are just text in the payload. Anyone can write one of ` +
    `these links from scratch in minutes, in any name, with no mod and no recompile. Reach and aim are ` +
    `measured on the player's own client. Treat it as a record of a fight, not proof.</div>`);

  const app = document.getElementById('app');
  app.innerHTML = h;
  app.setAttribute('aria-busy', 'false');
  attachPanZoom();
  revealOnScroll();
}

// Pan, zoom, and click-to-read. Kept in step with ReportBuilder.chartScript() in
// the mod. The offline report and this page behave identically on purpose.
//
// A click selects the NEAREST point rather than demanding a direct hit: the dots
// are three pixels across and hitting one exactly is not realistic on a dense
// chart. The search radius scales with zoom so it stays constant on screen, and
// drags are excluded by distance travelled so panning doesn't select anything.
// Sections fade up once as they enter the viewport. Cheap, and it gives a long
// report a sense of order rather than dumping everything at once.
function revealOnScroll() {
  // .hero, not the .who it replaced — that class stopped being emitted in the
  // redesign and the selector had been quietly matching nothing since.
  const targets = [...document.querySelectorAll('h2,.cards,.chartwrap,.hero,.note,.thin')];
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const show = el => el.classList.add('shown');

  if (reduced || !('IntersectionObserver' in window)) return;

  // Two frames so layout has settled: the charts are percentage-width and have no
  // resolved height at end-of-body, so measuring there finds nothing below the
  // fold. If frames never run, the reveal never applies and everything stays
  // visible, which is the outcome we want anyway.
  requestAnimationFrame(() => requestAnimationFrame(() => {

  // Only what is below the fold is ever made transparent. Anything already on
  // screen is left alone, so the page cannot open blank even if the observer
  // never fires.
  targets.forEach(el => {
    if (el.getBoundingClientRect().top >= window.innerHeight) el.classList.add('reveal');
  });

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) { show(en.target); io.unobserve(en.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  targets.forEach(el => { if (el.classList.contains('reveal')) io.observe(el); });

  // Failsafe. A page that never appears is far worse than one that appears
  // without the animation, so nothing stays hidden if the observer never fires.
  setTimeout(() => targets.forEach(show), 1200);
  }));
}

function attachPanZoom() {
  document.querySelectorAll('svg.chart').forEach(function (svg) {
    const vb = svg.getAttribute('viewBox').split(' ').map(Number);
    const init = vb.slice();
    let v = { x: vb[0], y: vb[1], w: vb[2], h: vb[3] };
    const ap = () => svg.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);

    // Found from the .chartwrap, not the immediate parent. The chart sits inside a
    // scroller so it can keep a readable width on a phone, which puts a div between
    // the svg and its readout — parentNode looked right and silently returned null,
    // leaving the click-to-read value with nowhere to print.
    const out = svg.closest('.chartwrap').querySelector('.readout');
    let sel = null;
    function clearSel() {
      if (sel) { sel.removeAttribute('data-sel'); sel = null; }
      if (out) { out.textContent = out.getAttribute('data-hint'); out.classList.remove('on'); }
    }
    function pick(c) {
      if (sel) sel.removeAttribute('data-sel');
      sel = c; c.setAttribute('data-sel', '1');
      if (out) {
        const t = c.querySelector('title');
        out.textContent = t ? t.textContent : '';
        out.classList.add('on');
      }
    }

    svg.addEventListener('wheel', function (e) {
      e.preventDefault();
      const r = svg.getBoundingClientRect();
      const mx = v.x + (e.clientX - r.left) / r.width * v.w;
      const my = v.y + (e.clientY - r.top) / r.height * v.h;
      const f = e.deltaY < 0 ? 0.85 : 1 / 0.85;
      v.w *= f; v.h *= f;
      v.x = mx - (e.clientX - r.left) / r.width * v.w;
      v.y = my - (e.clientY - r.top) / r.height * v.h;
      ap();
    }, { passive: false });

    let dragging = false, lx = 0, ly = 0, moved = 0;
    svg.addEventListener('mousedown', e => {
      dragging = true; lx = e.clientX; ly = e.clientY; moved = 0; svg.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      moved += Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly);
      const r = svg.getBoundingClientRect();
      v.x -= (e.clientX - lx) / r.width * v.w;
      v.y -= (e.clientY - ly) / r.height * v.h;
      lx = e.clientX; ly = e.clientY; ap();
    });
    window.addEventListener('mouseup', () => { dragging = false; svg.style.cursor = 'grab'; });

    svg.addEventListener('click', function (e) {
      if (moved > 4) return;   // that was a pan, not a click
      const r = svg.getBoundingClientRect();
      const ux = v.x + (e.clientX - r.left) / r.width * v.w;
      const uy = v.y + (e.clientY - r.top) / r.height * v.h;
      let best = null, bd = Infinity;
      svg.querySelectorAll('circle').forEach(function (c) {
        const dx = +c.getAttribute('cx') - ux, dy = +c.getAttribute('cy') - uy;
        const dd = dx * dx + dy * dy;
        if (dd < bd) { bd = dd; best = c; }
      });
      const lim = 14 * (v.w / init[2]);
      if (best && bd <= lim * lim) pick(best); else clearSel();
    });

    // Ease the viewBox back rather than snapping, so the reset reads as a movement
    // you can follow instead of a jump cut.
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    svg.addEventListener('dblclick', () => {
      clearSel();
      if (reduced) { v = { x: init[0], y: init[1], w: init[2], h: init[3] }; ap(); return; }
      const from = { ...v }, t0 = performance.now();
      const step = now => {
        const k = Math.min(1, (now - t0) / 260);
        const e = 1 - Math.pow(1 - k, 3);
        v.x = from.x + (init[0] - from.x) * e;
        v.y = from.y + (init[1] - from.y) * e;
        v.w = from.w + (init[2] - from.w) * e;
        v.h = from.h + (init[3] - from.h) * e;
        ap();
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  });
}

function showMessage(title, body) {
  const app = document.getElementById('app');
  // .msg, not the old #empty: the redesign's stylesheet is what gives this its
  // reading measure and heading gap, and emitting the pre-redesign class name left
  // all three non-chart states — empty, unsupported, corrupt link — running full
  // page width with no styling of their own.
  app.innerHTML = `<div class="msg"><h1>${esc(title)}</h1><p>${body}</p></div>`;
  // Every exit from boot() lands here, so this is where busy has to be lifted.
  // Clearing it only in render() left the empty, unsupported and corrupt-link
  // states announcing themselves as still loading, forever.
  app.setAttribute('aria-busy', 'false');
}

async function boot() {
  const frag = location.hash.replace(/^#/, '').trim();
  if (!frag) {
    showMessage('Combat Tracker', 'This page renders a Combat Tracker session that is carried entirely inside ' +
      'the link &mdash; there is no server and nothing is stored here. Open a session link to view it, or grab ' +
      'the mod from <a href="https://github.com/builtdoor1/Combat-Tracker" style="color:#29b6f6">GitHub</a> and ' +
      'record your own with <code>Stop Recording</code>.');
    return;
  }
  if (typeof DecompressionStream === 'undefined') {
    showMessage('Unsupported browser', 'This page needs <code>DecompressionStream</code> to unpack the session. ' +
      'Any current Chrome, Edge, Firefox or Safari has it.');
    return;
  }
  try {
    render(decode(await inflateRaw(b64urlToBytes(frag))));
  } catch (err) {
    showMessage('Could not read this link', 'The session data appears truncated or corrupted &mdash; chat clients ' +
      'sometimes cut long links in half. Ask for it again as a full copy-paste.<br><br><code>' +
      esc(err && err.message ? err.message : String(err)) + '</code>');
  }
}

window.addEventListener('hashchange', boot);
boot();
</script>
</body>
</html>
